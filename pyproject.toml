[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hillstrom-ab"
version = "0.1.0"
description = "Readout of the Hillstrom e-mail A/B test: metrics in DuckDB SQL, analysis in Python"
requires-python = ">=3.10"
authors = [{name = "Can Zhang"}]
license = {text = "MIT"}
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hillstrom_ab = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
